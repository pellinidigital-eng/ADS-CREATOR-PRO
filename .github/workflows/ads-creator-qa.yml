name: Ads Creator QA
on:
  push:
    branches:
      - fix/ads-brief-relevance-20261116
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  regression-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build Next.js
        run: npm run build
